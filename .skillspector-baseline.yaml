version: 2

# Reviewed findings in the generated plugin/skills, accepted as false positives or as
# upstream pstack policy. The skill text is cursor/plugins pstack after convert.mjs, so
# a finding here is upstream's wording. A new finding after an upstream pull fails CI
# until someone reads it and either adds a rule here or keeps the old plugin/.
# Rules match on id + path + excerpt text, not line numbers, so unrelated upstream edits
# do not re-flag them. Each skill is scanned on its own, so `path` is relative to it and
# a rule on "SKILL.md" covers that path in every skill. Re-review the scan whenever the
# SkillSpector pin changes.
# Docs: https://github.com/NVIDIA/SkillSpector/blob/main/docs/SUPPRESSION.md
rules:
  # RA2 "Session Persistence" has a hidden-file regex that runs from any "write" or
  # "create" to the next `~/.` path, across paragraphs. convert.mjs writes Claude paths
  # as `$HOME/.claude/` so ordinary prose does not match; a new RA2 finding is real text
  # to read. setup-pstack's overlay keeps `~/.claude/` because it does write that file.
  - id: "RA2"
    path: "SKILL.md"
    message: "*write `~/.claude/rules/pstack-models.md`*"
    reason: >-
      setup-pstack: writes the user's pstack model config when the user runs
      /pstack:setup-pstack. That rule file is the intended, user-requested output.

  # AS1/AS3 fire on paths to skill files. convert.mjs rewrites upstream's `.cursor/`
  # paths to `.claude/`, so these point at Claude Code skill directories.
  - id: "AS3"
    path: "SKILL.md"
    message: "*personal category directory (`.claude/skills*"
    reason: "automate-me: checks for an existing mode skill before writing a new one the user asked for."
  - id: "AS1"
    path: "SKILL.md"
    message: "*find the verification skill to maintain*"
    reason: "maintain-verification-skill: locates the project's own verification skill to update it."
  - id: "AS1"
    path: "SKILL.md"
    message: "*find this conversation's transcript in the transcript directory*"
    reason: "reflect: reads the current project's own transcript and forbids globbing other projects."
  - id: "AS3"
    path: "SKILL.md"
    message: "*find the verification skill to maintain*"
    reason: "maintain-verification-skill: same lookup as the AS1 rule above."
  - id: "AS3"
    path: "playbooks/multi-phase-plan.md"
    message: "skills/*/skill.md"
    reason: "poteto-mode multi-phase plan: references to sibling pstack skills (swarm, how, interrogate, show-me-your-work) by path."

  # Upstream policy, reviewed and accepted by installing pstack.
  - id: "EA2"
    path: "SKILL.md"
    message: "without asking"
    reason: >-
      poteto-mode's Autonomy section lets reversible work proceed without asking and
      lists irreversible writes that always pause. automate-me uses the phrase as a
      section heading for the user's own autonomy preferences. The finding text is only
      the phrase, so this rule hides "without asking" in every SKILL.md, including new
      upstream uses; re-read the upstream diff for the phrase when pulling.
  - id: "TM1"
    path: "playbooks/babysit.md"
    message: "git push --force"
    reason: "The owner publishes its own rebase with `git push --force-with-lease`, per autopilot-full."
  - id: "TM1"
    path: "playbooks/opening-a-pr.md"
    message: "git reset --hard"
    reason: "opening-a-pr: `git fetch && git reset --hard origin/<branch>` resyncs a worktree between agent calls on the same branch."
  - id: "SC1"
    path: "scripts/package.json"
    message: "*\"latest\"*"
    reason: >-
      poteto-mode's optional orchestration scripts pin `bun-types` and `typescript`
      devDependencies to "latest" upstream. The plugin never installs them; they run
      only if the user runs those scripts with bun.
  - id: "LP3"
    path: "SKILL.md"
    reason: >-
      Missing `permissions` field, reported for poteto-mode. Claude Code skills have no
      such field, so this rule applies to every skill.

  # Pattern misfires.
  - id: "MP3"
    path: "references/feature-map-example/README.md"
    message: "clear state"
    reason: "create-verification-skill example feature map: an app feature that clears its own state."
  - id: "MP3"
    path: "SKILL.md"
    message: "delete history"
    reason: "show-me-your-work: the rule says never edit or delete history (append-only log)."
  - id: "RA1"
    path: "references/*-reviewer.md"
    message: "edit skill"
    reason: "reflect reviewer prompts: \"do not write code, edit skills, or commit\"."
  - id: "TR2"
    path: "SKILL.md"
    message: "*conflicts with built-in command 'commit'*"
    reason: "technical-writing: its description mentions writing commit messages; it defines no /commit command."
  - id: "AE1"
    path: "SKILL.md"
    message: "*references/patterns.md*"
    reason: "typescript-best-practices: the scanner did not fully read references/patterns.md, which is plain TypeScript guidance."
